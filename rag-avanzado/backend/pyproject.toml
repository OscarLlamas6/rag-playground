[project]
name = "rag-avanzado-backend"
version = "0.1.0"
description = "RAG avanzado: GraphRAG (grafo en PostgreSQL con CTE recursivas), comunidades, descomposición y recuperación contextual (FastAPI + pgvector)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "networkx>=3.3",
    "numpy>=2.0",
    "openai>=1.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
