# https://taskfile.dev · `task` lista las tareas · requiere: uv (Python), Go y, para Docker, docker compose.
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Instala las dependencias de Python
    dir: backend
    cmds:
      - uv sync

  backend:
    desc: API en http://localhost:8010 (documentación en /docs)
    dir: backend
    cmds:
      - uv run uvicorn app.main:app --reload --port 8010

  web:
    desc: Interfaz en http://localhost:8081
    dir: web
    cmds:
      - go run .

  test:
    desc: Pruebas de Python (sin servidores ni cuentas) y de Go
    cmds:
      - task: test:backend
      - task: test:web

  test:backend:
    desc: Pruebas de Python
    dir: backend
    cmds:
      - uv run pytest -q

  test:web:
    desc: vet y pruebas de Go
    dir: web
    cmds:
      - go vet ./...
      - go test ./...

  demo:
    desc: Backend sin cuentas ni servidores (embeddings y modelo "fake", todo en memoria)
    dir: backend
    env:
      LLM_PROVIDER: fake
      EMBEDDINGS_PROVIDER: fake
      STORE: memory
    cmds:
      - uv run uvicorn app.main:app --port 8010

  docker:up:
    desc: Todo en contenedores, con tu .env → http://localhost:8081
    cmds:
      - docker compose up --build -d

  docker:demo:
    desc: Todo en contenedores, sin cuentas ni servidores → http://localhost:8081
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build -d

  docker:up:host:
    desc: "Como docker:up, pero en la red del anfitrión (solo Linux): alcanza LM Studio en localhost sin abrirlo a la red"
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.host.yml up --build -d

  docker:down:
    desc: Detiene y elimina los contenedores
    cmds:
      - docker compose down

  docker:logs:
    desc: Sigue los logs de los contenedores
    cmds:
      - docker compose logs -f
