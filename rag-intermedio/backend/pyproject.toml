[project]
name = "rag-intermedio-backend"
version = "0.1.0"
description = "RAG intermedio: ingesta multiformato, padre-hijo, BM25 + vectores (RRF), filtros, reranking (FastAPI + Pinecone)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=2.0",
    "openai>=1.0",
    "pinecone>=7.0",
    "pydantic>=2.8",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
