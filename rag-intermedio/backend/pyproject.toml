[project]
name = "rag-intermedio-backend"
version = "0.1.0"
description = "RAG intermedio: ingesta multiformato, padre-hijo, BM25 + vectores (RRF), filtros, reranking (FastAPI + Pinecone)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=2.0",
    "openai>=1.0",
    "pinecone>=7.0",
    "pydantic>=2.8",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
# Ingesta moderna (PDF con Docling + OCR, audio y video con faster-whisper). Pesado y OPCIONAL: `uv sync --group media`.
# `av<16` es obligatorio con faster-whisper 1.2.x (con av 16 o superior falla al abrir el audio).
media = [
    "docling>=2.60",
    "faster-whisper>=1.1",
    "av<16",
    "torch>=2.4",
    "torchvision>=0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["media: pruebas reales con Docling y faster-whisper (necesitan el grupo `media` y los medios; `-m media`)"]
addopts = "-m 'not media'"

[tool.uv]
package = false

# torch SOLO CPU (la versión por defecto arrastra gigas de CUDA que aquí no sirven)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
